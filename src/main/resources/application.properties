spring.application.name=DSA

# Import local secrets (this file is gitignored so your keys are safe!)
spring.config.import=optional:classpath:application-secret.properties

# Database Configuration (Overrides in application-secret.properties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/curious_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Google OAuth Configuration (Overrides in application-secret.properties)
google.client.id=451993711369-jif291jkvlv3b1eoov2m2pvdtgs5f3r1.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-id=451993711369-jif291jkvlv3b1eoov2m2pvdtgs5f3r1.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}

# JWT Secret Key (Overrides in application-secret.properties)
jwt.secret.key=${JWT_SECRET:your_secure_jwt_secret_key_here}

# Server Configuration
server.port=8080

# Logging
logging.level.com.selfhelp=DEBUG
logging.level.org.springframework.security=DEBUG

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# AWS S3 Configuration
aws.s3.bucket=curious-minds-ebook
aws.s3.region=ap-south-1
aws.cloudfront.url=https://d2ph7qitfey74a.cloudfront.net

aws.s3.cover.bucket=curious-minds-book-cover
aws.cloudfront.cover.url=https://d3jyq8qrl3ycnd.cloudfront.net

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always