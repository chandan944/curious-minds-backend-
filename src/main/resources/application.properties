spring.application.name=DSA

# Import local secrets (this file is gitignored so your keys are safe!)
spring.config.import=optional:classpath:application-secret.properties



# HTTP Response Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html,text/plain

# Google OAuth Configuration (Overrides in application-secret.properties)
google.client.id=57112013652-58jndtgfv378k5lvr0hrvkg32u00ccf5.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-id=57112013652-58jndtgfv378k5lvr0hrvkg32u00ccf5.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}

# JWT Secret Key (Overrides in application-secret.properties)
jwt.secret.key=${JWT_SECRET:your_secure_jwt_secret_key_here}

# Server Configuration
server.port=8080
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=10

# Logging
logging.level.com.selfhelp=DEBUG
logging.level.org.springframework.security=DEBUG

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# AWS S3 / Cloudflare R2 Configuration
aws.access.key.id=${AWS_ACCESS_KEY_ID:}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket=${R2_BUCKET_NAME:ebooks}
aws.s3.region=${R2_REGION:apac}
aws.cloudfront.url=${R2_PUBLIC_URL:https://pub-xxxx.r2.dev}
aws.s3.endpoint=${R2_ENDPOINT:}

aws.s3.cover.bucket=${R2_COVER_BUCKET_NAME:ebooks}
aws.cloudfront.cover.url=${R2_COVER_PUBLIC_URL:https://pub-xxxx.r2.dev}

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Firebase Config Path mapping
firebase.config.path=${GOOGLE_APPLICATION_CREDENTIALS:}

# Expo Push Token Configuration
expo.access.token=${EXPO_ACCESS_TOKEN:}