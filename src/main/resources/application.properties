spring.application.name=DSA

# Import local secrets (this file is gitignored so your keys are safe!)
spring.config.import=optional:classpath:application-secret.properties

# Database Configuration (Overrides in application-secret.properties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/curious_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Google OAuth Configuration (Overrides in application-secret.properties)
google.client.id=451993711369-jif291jkvlv3b1eoov2m2pvdtgs5f3r1.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-id=451993711369-jif291jkvlv3b1eoov2m2pvdtgs5f3r1.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}

# JWT Secret Key (Overrides in application-secret.properties)
jwt.secret.key=${JWT_SECRET:your_secure_jwt_secret_key_here}

# Server Configuration
server.port=8080

# Logging
logging.level.com.selfhelp=DEBUG
logging.level.org.springframework.security=DEBUG