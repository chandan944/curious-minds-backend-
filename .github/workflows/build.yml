name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/DSA-0.0.1-SNAPSHOT.jar

  deploy:
    needs: build-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Copy JAR to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 13.205.35.29
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/DSA-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Restart Service via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.205.35.29
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mv /home/ubuntu/DSA-0.0.1-SNAPSHOT.jar /home/ubuntu/app.jar
            sudo systemctl restart myapp
            echo "Deployment successful! Live at https://curiousminds.dpdns.org"
